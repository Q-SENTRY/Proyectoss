name: Crear APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copiar la app web
        run: mkdir -p android/app/src/main/assets && cp compras/index.html compras/icon.svg compras/manifest.json android/app/src/main/assets/
      - name: Compilar
        run: cd android && gradle assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk MisCompras.apk
      - uses: actions/upload-artifact@v4
        with: { name: MisCompras-apk, path: MisCompras.apk }
