<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bf6"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Mis Compras</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d1d2b;--mu:#7a7a90;--pr:#5b5bf6;--ok:#22b07d;--bd:#e6e6ef}
@media(prefers-color-scheme:dark){:root{--bg:#12121a;--card:#1c1c28;--tx:#f1f1f7;--mu:#9a9ab0;--bd:#2c2c3c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:110px}
header{padding:calc(20px + env(safe-area-inset-top)) 18px 10px;position:sticky;top:0;background:var(--bg);z-index:2}
h1{margin:0;font-size:28px}.sum{color:var(--mu);margin-top:4px;font-size:14px}
.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1;padding:10px;border:0;border-radius:12px;background:var(--card);color:var(--mu);font-weight:600;font-size:14px}
.tabs button.on{background:var(--pr);color:#fff}
input.s{width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
main{padding:6px 16px;display:grid;gap:10px}
.it{background:var(--card);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px #0000000d}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);flex:none;background:none;display:grid;place-items:center;color:#fff;font-size:16px}
.it.done .ck{background:var(--ok);border-color:var(--ok)}.it.done .n{text-decoration:line-through;color:var(--mu)}
.b{flex:1;min-width:0}.n{font-weight:600;font-size:16px;word-break:break-word}
.m{font-size:13px;color:var(--mu);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.m a{color:var(--pr);text-decoration:none;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p{font-weight:700;white-space:nowrap}.ed{border:0;background:none;color:var(--mu);font-size:20px;padding:6px}
.empty{text-align:center;color:var(--mu);padding:60px 20px}.empty div{font-size:48px}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:20px;border:0;background:var(--pr);color:#fff;font-size:32px;box-shadow:0 8px 24px #5b5bf666}
dialog{border:0;border-radius:24px 24px 0 0;width:100%;max-width:560px;margin:auto auto 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}dialog h2{margin:0 0 14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px;font-weight:600}
dialog input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:10px}.row>div{flex:1}
.act{display:flex;gap:10px;margin-top:18px}.act button{flex:1;padding:14px;border-radius:14px;border:0;font-size:16px;font-weight:600}
.sv{background:var(--pr);color:#fff}.cn{background:var(--bg);color:var(--tx)}.dl{background:#ff4d5e22;color:#ff4d5e;flex:0 0 auto!important}
.pa{border:0;background:none;color:var(--pr);font-weight:600;font-size:13px;padding:0}
</style></head><body>
<header><h1>🛍️ Mis Compras</h1><div class="sum" id="sum"></div>
<div class="tabs"><button data-f="pend" class="on">Pendientes</button><button data-f="done">Compradas</button><button data-f="all">Todas</button></div>
<input class="s" id="q" placeholder="🔍 Buscar..." type="search"></header>
<main id="list"></main>
<button class="fab" id="add" aria-label="Añadir">+</button>
<dialog id="dlg"><form method="dialog" id="f"><h2 id="tt">Nueva compra</h2>
<label>Producto *</label><input name="name" required placeholder="Ej: Audífonos inalámbricos">
<label>Enlace del producto <button type="button" class="pa" id="paste">📋 Pegar</button></label><input name="url" type="url" inputmode="url" placeholder="https://...">
<div class="row"><div><label>Precio</label><input name="price" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
<div><label>Cantidad</label><input name="qty" type="number" min="1" value="1" inputmode="numeric"></div></div>
<label>Nota</label><input name="note" placeholder="Color, talla, tienda...">
<div class="act"><button type="button" class="dl" id="del" hidden>🗑️</button><button type="button" class="cn" id="cancel">Cancelar</button><button class="sv">Guardar</button></div>
</form></dialog>
<script>
const K='compras',$=s=>document.querySelector(s);let items=[],filt='pend',edit=null;
try{items=JSON.parse(localStorage.getItem(K))||[]}catch{}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(items))}catch{}render()};
const money=n=>n.toLocaleString('es',{style:'currency',currency:'USD'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host=u=>{try{return new URL(u).hostname.replace('www.','')}catch{return u}};
function render(){
  const q=$('#q').value.toLowerCase();
  const v=items.filter(i=>(filt=='all'||(filt=='done')==i.done)&&(i.name+i.note).toLowerCase().includes(q));
  const pend=items.filter(i=>!i.done),tot=pend.reduce((a,i)=>a+(+i.price||0)*(+i.qty||1),0);
  $('#sum').textContent=`${pend.length} pendiente${pend.length!=1?'s':''} · Total ${money(tot)}`;
  $('#list').innerHTML=v.length?v.map(i=>`<div class="it ${i.done?'done':''}" data-id="${i.id}">
   <button class="ck" data-a="t">${i.done?'✓':''}</button>
   <div class="b"><div class="n">${esc(i.name)}${i.qty>1?` <span style="color:var(--mu)">×${i.qty}</span>`:''}</div>
   <div class="m">${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">🔗 ${esc(host(i.url))}</a>`:''}${i.note?`<span>${esc(i.note)}</span>`:''}</div></div>
   ${i.price?`<div class="p">${money(i.price*(i.qty||1))}</div>`:''}<button class="ed" data-a="e">⋯</button></div>`).join('')
   :`<div class="empty"><div>🛒</div>${items.length?'Nada por aquí':'Toca <b>+</b> para añadir tu primera compra'}</div>`;
}
function open(i){edit=i;const f=$('#f');f.reset();$('#tt').textContent=i?'Editar compra':'Nueva compra';$('#del').hidden=!i;
  if(i)for(const k of['name','url','price','qty','note'])f[k].value=i[k]??'';$('#dlg').showModal()}
$('#add').onclick=()=>open(null);$('#cancel').onclick=()=>$('#dlg').close();
$('#del').onclick=()=>{if(confirm('¿Eliminar esta compra?')){items=items.filter(x=>x!==edit);$('#dlg').close();save()}};
$('#paste').onclick=async()=>{try{$('#f').url.value=(await navigator.clipboard.readText()).trim()}catch{alert('Pega el enlace manualmente')}};
$('#f').onsubmit=()=>{const f=$('#f'),d={name:f.name.value.trim(),url:f.url.value.trim(),price:parseFloat(f.price.value)||0,qty:parseInt(f.qty.value)||1,note:f.note.value.trim()};
  if(edit)Object.assign(edit,d);else items.unshift({id:Date.now(),done:false,...d});save()};
$('#list').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=items.find(x=>x.id==b.closest('.it').dataset.id);
  if(b.dataset.a=='t'){i.done=!i.done;save()}else open(i)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelector('.tabs .on').classList.remove('on');b.classList.add('on');filt=b.dataset.f;render()});
$('#q').oninput=render;render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
