<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5b5bf6"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Mis Compras</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#17172a;--mu:#80809a;--pr:#5b5bf6;--pr2:#8b5cf6;--ok:#16b47c;--rd:#ff4d5e;--bd:#e7e7f1;--sh:0 2px 10px #1b1b4b0f;--ease:cubic-bezier(.2,.9,.3,1.2)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f17;--card:#1b1b27;--tx:#f2f2f8;--mu:#9a9ab3;--bd:#2b2b3b;--sh:0 2px 10px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:120px;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer}button:active{transform:scale(.96)}
/* Cabecera */
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 64px;border-radius:0 0 30px 30px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.5px}
.hero .sub{opacity:.85;font-size:14px;margin-top:2px}
.stats{display:flex;gap:10px;margin-top:18px}
.st{flex:1;background:#ffffff26;border-radius:16px;padding:12px;backdrop-filter:blur(6px)}
.st b{display:block;font-size:20px;transition:.3s}.st span{font-size:12px;opacity:.85}
.prog{height:6px;background:#ffffff33;border-radius:9px;margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .6s var(--ease)}
/* Barra de controles */
.ctl{margin:-44px 16px 0;position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:5;background:var(--card);border-radius:20px;padding:10px;box-shadow:0 8px 30px #1b1b4b1a}
.sr{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:0 12px}
.sr input{flex:1;border:0;background:none;padding:12px 0;color:var(--tx);font-size:16px;outline:none}
.tabs{position:relative;display:flex;margin-top:10px;background:var(--bg);border-radius:14px;padding:4px}
.tabs button{flex:1;position:relative;z-index:1;border:0;background:none;padding:9px 4px;color:var(--mu);font-weight:600;font-size:14px;transition:color .25s}
.tabs button.on{color:var(--pr)}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--card);border-radius:11px;box-shadow:var(--sh);transition:transform .35s var(--ease)}
.cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--pr);color:#fff;font-size:11px;line-height:18px}
/* Lista */
main{padding:16px;display:grid;gap:10px}
.sw{position:relative;border-radius:18px;overflow:hidden;animation:in .45s var(--ease) both}
.sw.out{animation:out .35s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes out{to{opacity:0;transform:translateX(40px);height:0;margin-top:-10px}}
.bgL,.bgR{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;color:#fff;font-weight:700;font-size:14px;opacity:0}
.bgL{background:var(--ok)}.bgR{background:var(--rd);justify-content:flex-end}
.it{position:relative;background:var(--card);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh);transition:transform .3s var(--ease),background .3s;touch-action:pan-y}
.it.drag{transition:none}
.av{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.b{flex:1;min-width:0}
.n{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .3s}
.m{font-size:13px;color:var(--mu);margin-top:4px;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}
.m .nt{overflow:hidden;text-overflow:ellipsis}
.lk{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;background:#5b5bf61a;color:var(--pr);font-weight:600;font-size:12px;text-decoration:none;flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.p{font-weight:700;font-size:15px;white-space:nowrap;text-align:right}.p small{display:block;color:var(--mu);font-weight:500;font-size:11px}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);flex:none;background:none;display:grid;place-items:center;padding:0;transition:.3s var(--ease)}
.ck svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s}
.done .ck{background:var(--ok);border-color:var(--ok);transform:scale(1.08)}.done .ck svg{stroke-dashoffset:0}
.done .n{color:var(--mu);text-decoration:line-through}.done .av{filter:grayscale(.8);opacity:.6}
.empty{text-align:center;color:var(--mu);padding:50px 20px;animation:in .5s var(--ease)}
.empty .ic{font-size:64px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.empty h3{color:var(--tx);margin:10px 0 4px}
.hint{text-align:center;font-size:12px;color:var(--mu);margin-top:4px}
/* Botón flotante */
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));height:60px;padding:0 24px 0 20px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px #5b5bf670;z-index:6;transition:transform .3s var(--ease)}
.fab span{font-size:28px;line-height:0;transition:transform .4s var(--ease)}.fab:active span{transform:rotate(90deg)}
/* Hoja inferior */
.ov{position:fixed;inset:0;background:#0b0b1a80;opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s var(--ease);z-index:11;max-height:92vh;overflow:auto;-webkit-user-select:text;user-select:text}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--bd);margin:0 auto 14px}
.sheet h2{margin:0 0 6px;font-size:22px}
.fld{position:relative;margin-top:12px}
.fld label{display:block;font-size:13px;color:var(--mu);font-weight:600;margin:0 0 6px 2px}
.fld input{width:100%;padding:14px;border-radius:14px;border:2px solid transparent;background:var(--bg);color:var(--tx);font-size:16px;outline:none;transition:border-color .2s,background .2s}
.fld input:focus{border-color:var(--pr);background:var(--card)}
.fld.err input{border-color:var(--rd);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.paste{position:absolute;right:8px;bottom:8px;border:0;background:var(--pr);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.row{display:flex;gap:10px}.row .fld{flex:1}
.step{display:flex;align-items:center;background:var(--bg);border-radius:14px;height:52px}
.step button{width:46px;height:100%;border:0;background:none;color:var(--pr);font-size:22px;font-weight:700}
.step input{text-align:center;padding:0;background:none!important;border:0!important;height:100%}
.act{display:flex;gap:10px;margin-top:20px}
.act button{flex:1;padding:15px;border-radius:16px;border:0;font-size:16px;font-weight:700}
.sv{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 6px 18px #5b5bf650}
.dl{background:#ff4d5e1a;color:var(--rd);flex:0 0 56px!important}
.op{background:#16b47c1a;color:var(--ok)}
/* Aviso */
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:420px;margin:auto;background:#22223a;color:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;transform:translateY(30px);opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:20;font-size:15px}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast button{margin-left:auto;border:0;background:none;color:#a9a9ff;font-weight:700;font-size:15px}
</style></head><body>
<div class="hero">
  <h1>🛍️ Mis Compras</h1><div class="sub" id="greet">Tu lista de deseos y compras</div>
  <div class="stats">
    <div class="st"><b id="sPend">0</b><span>Por comprar</span></div>
    <div class="st"><b id="sTot">$0</b><span>Total pendiente</span></div>
    <div class="st"><b id="sDone">0</b><span>Compradas</span></div>
  </div>
  <div class="prog"><i id="bar"></i></div>
</div>
<div class="ctl">
  <div class="sr">🔍<input id="q" placeholder="Buscar producto o tienda" type="search"></div>
  <div class="tabs" id="tabs"><div class="pill"></div>
    <button data-f="pend" class="on">Pendientes</button><button data-f="done">Compradas</button><button data-f="all">Todas</button></div>
</div>
<main id="list"></main>
<div class="hint" id="hint">Desliza → para marcar · ← para eliminar</div>
<button class="fab" id="add"><span>+</span>Añadir</button>

<div class="ov" id="ov"></div>
<form class="sheet" id="sheet" novalidate>
  <div class="grab"></div><h2 id="tt">Nueva compra</h2>
  <div class="fld" id="fName"><label>¿Qué quieres comprar?</label><input name="name" placeholder="Ej: Audífonos inalámbricos" autocomplete="off"></div>
  <div class="fld"><label>Enlace del producto</label><input name="url" type="url" inputmode="url" placeholder="https://..." style="padding-right:90px"><button type="button" class="paste" id="paste">Pegar</button></div>
  <div class="row">
    <div class="fld"><label>Precio</label><input name="price" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
    <div class="fld"><label>Cantidad</label><div class="step"><button type="button" data-s="-1">−</button><input name="qty" type="number" min="1" value="1" inputmode="numeric"><button type="button" data-s="1">+</button></div></div>
  </div>
  <div class="fld"><label>Nota</label><input name="note" placeholder="Color, talla, tienda..."></div>
  <div class="act"><button type="button" class="dl" id="del" hidden>🗑️</button><button type="button" class="op" id="openL" hidden>Abrir enlace</button><button class="sv">Guardar</button></div>
</form>
<div class="toast" id="toast"><span id="tmsg"></span><button id="undo">Deshacer</button></div>

<script>
const K='compras',$=s=>document.querySelector(s),f=$('#sheet');
let items=[],filt='pend',edit=null,undoFn=null,tT;
try{items=JSON.parse(localStorage.getItem(K))||[]}catch{}
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(items))}catch{}};
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n||10)}catch{}};
const money=n=>'$'+(+n||0).toLocaleString('es',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^www\.|^m\./,'')}catch{return ''}};
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const fixUrl=u=>u&&!/^https?:\/\//i.test(u)?'https://'+u:u;

function count(el,to,fmt){const from=+el.dataset.v||0;el.dataset.v=to;const t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/450),v=from+(to-from)*(1-Math.pow(1-k,3));el.textContent=fmt?fmt(v):Math.round(v);if(k<1)requestAnimationFrame(step)})(t0)}

function stats(){const pend=items.filter(i=>!i.done),done=items.length-pend.length;
  count($('#sPend'),pend.length);count($('#sDone'),done);
  count($('#sTot'),pend.reduce((a,i)=>a+(+i.price||0)*(i.qty||1),0),money);
  $('#bar').style.width=items.length?done/items.length*100+'%':'0';
  const tb=document.querySelectorAll('#tabs button');
  tb[0].innerHTML='Pendientes'+(pend.length?`<span class="cnt">${pend.length}</span>`:'');}

function card(i,d){const h=host(i.url),lbl=(h||i.name).trim()[0]?.toUpperCase()||'?',c=hue(h||i.name);
  return `<div class="sw" data-id="${i.id}" style="animation-delay:${d*35}ms"><div class="bgL">✓ ${i.done?'Pendiente':'Comprada'}</div><div class="bgR">Eliminar 🗑️</div>
  <div class="it ${i.done?'done':''}">
   <button class="ck" data-a="t" aria-label="Marcar"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>
   <div class="av" style="background:linear-gradient(135deg,hsl(${c} 75% 60%),hsl(${c+40} 75% 50%))">${esc(lbl)}</div>
   <div class="b"><div class="n">${esc(i.name)}</div>
   <div class="m">${i.url?`<a class="lk" href="${esc(i.url)}" target="_blank" rel="noopener">🔗 ${esc(h||'Ver')}</a>`:''}<span class="nt">${esc(i.note)}</span></div></div>
   ${i.price?`<div class="p">${money(i.price*(i.qty||1))}${i.qty>1?`<small>${i.qty} × ${money(i.price)}</small>`:''}</div>`:i.qty>1?`<div class="p"><small>×${i.qty}</small></div>`:''}
  </div></div>`}

function render(anim=true){
  const q=$('#q').value.toLowerCase().trim();
  const v=items.filter(i=>(filt=='all'||(filt=='done')==!!i.done)&&(i.name+' '+i.note+' '+host(i.url)).toLowerCase().includes(q));
  const L=$('#list');
  L.innerHTML=v.length?v.map(card).join(''):`<div class="empty"><div class="ic">${q?'🔎':filt=='done'?'🎉':'🛒'}</div>
    <h3>${q?'Sin resultados':!items.length?'Tu lista está vacía':filt=='done'?'Aún no has comprado nada':'¡Todo comprado!'}</h3>
    ${!items.length?'Toca <b>Añadir</b> para guardar tu primer producto y su enlace':q?'Prueba con otra palabra':''}</div>`;
  if(!anim)L.querySelectorAll('.sw').forEach(e=>e.style.animation='none');
  $('#hint').style.display=v.length?'':'none';stats()}

function toast(msg,undo){$('#tmsg').textContent=msg;undoFn=undo;$('#undo').style.display=undo?'':'none';
  $('#toast').classList.add('show');clearTimeout(tT);tT=setTimeout(()=>$('#toast').classList.remove('show'),3500)}
$('#undo').onclick=()=>{undoFn&&undoFn();$('#toast').classList.remove('show')};

function removeEl(id,cb){const el=document.querySelector(`.sw[data-id="${id}"]`);
  if(!el)return cb();el.style.height=el.offsetHeight+'px';el.classList.add('out');setTimeout(cb,330)}
function toggle(i){i.done=!i.done;persist();buzz(i.done?[10,40,20]:10);
  const el=document.querySelector(`.sw[data-id="${i.id}"] .it`);el&&el.classList.toggle('done',i.done);stats();
  if(filt!='all')setTimeout(()=>removeEl(i.id,()=>render(false)),450);
  toast(i.done?'¡Marcada como comprada! 🎉':'Movida a pendientes',()=>{i.done=!i.done;persist();render()})}
function del(i){const idx=items.indexOf(i);buzz(30);removeEl(i.id,()=>{items.splice(idx,1);persist();render(false)});
  toast('Producto eliminado',()=>{items.splice(idx,0,i);persist();render()})}

/* Hoja */
function open(i){edit=i;f.reset();$('#toast').classList.remove('show');$('#fName').classList.remove('err');$('#tt').textContent=i?'Editar compra':'Nueva compra';
  $('#del').hidden=!i;$('#openL').hidden=!(i&&i.url);
  if(i)for(const k of['name','url','price','qty','note'])f[k].value=i[k]||(k=='qty'?1:'');
  $('#ov').classList.add('show');f.classList.add('show');if(!i)setTimeout(()=>f.name.focus(),350)}
function close(){$('#ov').classList.remove('show');f.classList.remove('show');document.activeElement.blur()}
$('#add').onclick=()=>{buzz();open(null)};$('#ov').onclick=close;
$('#del').onclick=()=>{close();del(edit)};
$('#openL').onclick=()=>window.open(edit.url,'_blank');
$('#paste').onclick=async()=>{try{const t=(await navigator.clipboard.readText()).trim();if(t){f.url.value=t;buzz()}}catch{f.url.focus();toast('Mantén presionado el campo para pegar')}};
f.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{f.qty.value=Math.max(1,(+f.qty.value||1)+ +b.dataset.s);buzz(5)});
f.onsubmit=e=>{e.preventDefault();const name=f.name.value.trim();
  if(!name){const x=$('#fName');x.classList.remove('err');void x.offsetWidth;x.classList.add('err');buzz(60);f.name.focus();return}
  const d={name,url:fixUrl(f.url.value.trim()),price:parseFloat(f.price.value)||0,qty:parseInt(f.qty.value)||1,note:f.note.value.trim()};
  if(edit)Object.assign(edit,d);else{items.unshift({id:Date.now(),done:false,...d});if(filt=='done')setTab('pend')}
  persist();close();buzz([10,30,10]);render();toast(edit?'Cambios guardados':'¡Añadido a tu lista! 🛍️')};
/* Arrastrar la hoja hacia abajo para cerrar */
let sy=null;f.addEventListener('touchstart',e=>{if(f.scrollTop<=0&&e.target.closest('.grab,h2'))sy=e.touches[0].clientY},{passive:true});
f.addEventListener('touchmove',e=>{if(sy==null)return;const d=Math.max(0,e.touches[0].clientY-sy);f.style.transition='none';f.style.transform=`translateY(${d}px)`},{passive:true});
f.addEventListener('touchend',e=>{if(sy==null)return;const d=e.changedTouches[0].clientY-sy;sy=null;f.style.transition='';f.style.transform='';if(d>100)close()});

/* Pestañas */
function setTab(v){filt=v;const bs=[...document.querySelectorAll('#tabs button')],ix=bs.findIndex(b=>b.dataset.f==v);
  bs.forEach((b,k)=>b.classList.toggle('on',k==ix));$('.pill').style.transform=`translateX(${ix*100}%)`;render()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{buzz(5);setTab(b.dataset.f)});
$('#q').oninput=()=>render(false);

/* Lista: toques y deslizar */
const find=el=>items.find(x=>x.id==el.closest('.sw').dataset.id);
$('#list').addEventListener('click',e=>{if(e.target.closest('a'))return;const sw=e.target.closest('.sw');if(!sw||sw.dataset.moved)return;
  const i=find(sw);if(e.target.closest('[data-a=t]'))toggle(i);else{buzz(5);open(i)}});
let drag=null;
$('#list').addEventListener('touchstart',e=>{const sw=e.target.closest('.sw');if(!sw)return;delete sw.dataset.moved;
  drag={sw,it:sw.querySelector('.it'),x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,lock:null}},{passive:true});
$('#list').addEventListener('touchmove',e=>{if(!drag)return;const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y;
  if(drag.lock==null&&(Math.abs(dx)>8||Math.abs(dy)>8))drag.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(drag.lock!='x')return;drag.dx=dx;drag.sw.dataset.moved=1;drag.it.classList.add('drag');drag.it.style.transform=`translateX(${dx}px)`;
  drag.sw.querySelector('.bgL').style.opacity=dx>0?Math.min(1,dx/90):0;drag.sw.querySelector('.bgR').style.opacity=dx<0?Math.min(1,-dx/90):0},{passive:true});
$('#list').addEventListener('touchend',()=>{if(!drag)return;const {sw,it,dx}=drag,i=find(sw);drag=null;it.classList.remove('drag');it.style.transform='';
  setTimeout(()=>{sw.querySelectorAll('.bgL,.bgR').forEach(b=>b.style.opacity=0);delete sw.dataset.moved},300);
  if(dx>90)toggle(i);else if(dx<-90)del(i)});

const h=new Date().getHours();$('#greet').textContent=(h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches')+' 👋 ¿Qué compramos hoy?';
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
